const canvas=document.getElementById("card");
const ctx=canvas.getContext("2d");
const field=document.getElementById("guest");

function render(){
  if(!artwork.complete || !artwork.naturalWidth) return;
  ctx.clearRect(0,0,1080,1512);
  ctx.drawImage(artwork,0,0,1080,1512);

  // Remove only the dotted recipient line from the PDF artwork.
  ctx.fillStyle="#ffffff";
  ctx.fillRect(315,568,450,36);

  const name=field.value.trim();
  if(name){
    let size=32;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillStyle="#171313";
    ctx.font=`${size}px Georgia, "Times New Roman", serif`;
    while(ctx.measureText(name).width>420 && size>16){
      size--;
      ctx.font=`${size}px Georgia, "Times New Roman", serif`;
    }
    ctx.fillText(name,540,586);
  }
}
artwork.onload=render;
field.addEventListener("input",render);
document.getElementById("clear").addEventListener("click",()=>{
  field.value="";render();field.focus();
});
document.getElementById("download").addEventListener("click",()=>{
  render();
  const safe=(field.value.trim()||"Guest").replace(/[^\p{L}\p{N}-]+/gu,"_").slice(0,50);
  const a=document.createElement("a");
  a.download=`Lakshi_Sachintha_${safe}.png`;
  a.href=canvas.toDataURL("image/png");
  a.click();
});
</script>
